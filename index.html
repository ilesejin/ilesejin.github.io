<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Website."
    />
    <title>Your Name — Mathematics & Computer Science</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2310233f'/%3E%3Ctext x='32' y='44' text-anchor='middle' fill='%23a3e3ca' font-family='Georgia,serif' font-size='42'%3E%E2%88%AB%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/sections.css" />
    <link rel="stylesheet" href="assets/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <a class="wordmark" href="#top" aria-label="Homepage">
        <span data-site-name>Your Name</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="#background">Background</a>
        <a href="#experience">Experience</a>
        <a href="#publications">Publications</a>
      </nav>
    </header>

    <main id="main-content">
      <section class="intro section-shell" id="top" aria-labelledby="intro-title">
        <div class="intro-copy">
          <p class="lede" data-intro>
            I am an undergraduate researcher interested in the meeting point of mathematical theory and computational practice.
          </p>
          <div class="intro-actions">
            <a class="button button-primary" data-cv-link href="assets/your-name-cv.pdf">Download CV <span aria-hidden="true">↓</span></a>
            <a class="text-link" href="#publications">View publications <span aria-hidden="true">→</span></a>
          </div>
        </div>
      </section>

      <section class="background section-shell section-rule" id="background" aria-labelledby="background-title">
        <div class="section-label">
          <span>01</span>
          <h2 id="background-title">Background</h2>
        </div>
        <dl class="facts credential-list" data-facts></dl>
      </section>

      <section class="experience section-shell section-rule" id="experience" aria-labelledby="experience-title">
        <div class="section-label">
          <h2 id="experience-title">Experience</h2>
        </div>
        <dl class="facts credential-list" data-experience></dl>
      </section>

      <section class="publications section-shell section-rule" id="publications" aria-labelledby="publications-title">
        <div class="section-label">
          <span>02</span>
          <h2 id="publications-title">Publications</h2>
        </div>
        <div class="publication-content">
          <ol class="publication-list" data-publications></ol>
        </div>
      </section>

    </main>

    <footer class="site-footer section-shell">
      <p>© <span data-year></span> <span data-site-name>Your Name</span></p>
      <nav class="footer-links" data-footer-links aria-label="Academic profiles"></nav>
    </footer>

    <script src="assets/data.js"></script>
    <script src="assets/site.js"></script>
  </body>
</html>
